<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Shared icon sprite for gettysburginteractivemap.com. One consistent line-icon language
     (stroke-based, 1.7px weight, rounded caps, 24x24 viewBox) used everywhere an icon
     appears -- the Extra Features menu, onboarding cards, and every sub-page header.
     Usage: <svg class="gicon"><use href="/icons.svg#compass"/></svg> -->
<defs>

<symbol id="compass" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="9"/>
  <polygon points="12,7 14,12 12,17 10,12" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
</symbol>

<symbol id="sabers" viewBox="0 0 24 24">
  <line x1="4" y1="20" x2="18" y2="6"/>
  <line x1="4" y1="6" x2="18" y2="20"/>
  <path d="M15 3l3 3M18 3l-3 3"/>
  <path d="M6 15l-3 3M3 18l3-3"/>
</symbol>

<symbol id="film" viewBox="0 0 24 24">
  <rect x="3" y="5" width="18" height="14" rx="1.5"/>
  <line x1="8" y1="5" x2="8" y2="19"/>
  <line x1="16" y1="5" x2="16" y2="19"/>
  <line x1="3" y1="9" x2="8" y2="9"/>
  <line x1="3" y1="15" x2="8" y2="15"/>
  <line x1="16" y1="9" x2="21" y2="9"/>
  <line x1="16" y1="15" x2="21" y2="15"/>
</symbol>

<symbol id="book" viewBox="0 0 24 24">
  <path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5C4.7 20 4 19.3 4 18.5z"/>
  <path d="M20 5.5C20 4.7 19.3 4 18.5 4H12v16h6.5c.8 0 1.5-.7 1.5-1.5z"/>
</symbol>

<symbol id="pin" viewBox="0 0 24 24">
