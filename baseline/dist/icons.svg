<symbol id="eye-off" viewBox="0 0 24 24">
  <path d="M2 12s3.8-6.5 10-6.5c1.9 0 3.5.5 4.9 1.3M22 12s-1.3 2.3-3.7 4.1M9.5 9.7A2.6 2.6 0 0 0 12 14.6c.6 0 1.1-.2 1.6-.5"/>
