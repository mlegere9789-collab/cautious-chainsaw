<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Camera Modes — Gettysburg Animated Battlefield Map</title>
<meta name="description" content="Auto-camera and unit-follow modes: watch the battle unfold hands-free, or follow one regiment through the fighting." />
<link rel="canonical" href="https://gettysburginteractivemap.com/camera.html" />
<meta property="og:title" content="Camera Modes — Gettysburg Animated Battlefield Map" />
<meta property="og:description" content="Auto-camera and unit-follow modes: watch the battle unfold hands-free, or follow one regiment through the fighting." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://gettysburginteractivemap.com/camera.html" />

<meta name="twitter:description" content="Auto-camera and unit-follow modes: watch the battle unfold hands-free, or follow one regiment through the fighting." />

<link href="https://api.mapbox.com/mapbox-gl-js/v3.24.1/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.24.1/mapbox-gl.js"></script>
<style>
  :root { --bg:#0a0a14; --panel:#12121e; --ink:#e8e6df; --gold:#c9a24b; --muted:#8a93a8; --line:#1e1e2e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, serif; }
  header { padding: 20px 5% 12px; }
  header a.back { font-family: sans-serif; font-size: 12px; color: var(--muted); text-decoration:none; }
  h1 { font-size: clamp(20px, 3.2vw, 28px); color: var(--gold); margin: 8px 0 4px; }
  .sub { font-family: sans-serif; color: var(--muted); font-size: 13px; max-width: 640px; }
  #map { height: 62vh; min-height: 420px; }
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding: 14px 5%; font-family: sans-serif; font-size: 13px; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .mode-btn { padding: 7px 14px; border-radius: 6px; border:1px solid var(--line); background: transparent; color: var(--muted); cursor:pointer; font-family: sans-serif; font-size:13px; }
  .mode-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,162,75,0.08); }
  #unit-select { padding: 6px 10px; border-radius:6px; background: var(--bg); color: var(--ink); border:1px solid var(--line); display:none; }
  .play-btn { padding: 7px 18px; border-radius:6px; border:1px solid var(--gold); background: var(--gold); color:#0a0a14; font-weight:bold; cursor:pointer; }
  .play-btn.playing { background: transparent; color: var(--gold); }
  #tick-display { font-family: sans-serif; font-size:12px; color: var(--muted); margin-left:auto; }
  #tick-display b { color: var(--gold); }
  #atmosphere { position:absolute; inset:0; pointer-events:none; z-index:1; transition: background 1.5s ease; mix-blend-mode: multiply; }
  #map-wrap { position:relative; }
</style>
<link rel="stylesheet" href="/site-nav.css">
</head>
<body>
<div id="gtbg-nav-mount"></div>
<header>
  <a class="back" href="/index.html">&larr; Back to the map</a>
  <h1>Camera Modes</h1>
  <p class="sub"><b>Director Mode</b> auto-flies to wherever the most units are engaged, each tick. <b>Follow Cam</b> locks onto one regiment and tracks it through the whole battle.</p>
</header>
<div class="controls">
  <button type="button" class="mode-btn active" data-mode="director">Director Mode</button>
  <button type="button" class="mode-btn" data-mode="follow">Follow a Unit</button>
  <select id="unit-select"></select>
  <button type="button" class="play-btn" id="play-btn">&#9654; Play</button>
  <span id="tick-display">Tick <b id="tick-num">1</b> / 675</span>
</div>
<div id="map-wrap">
  <div id="map"></div>
  <div id="atmosphere"></div>
</div>

<script>
(async function() {
  const MAPBOX_TOKEN = "pk.eyJ1IjoibWxlZ2VyZTk3ODkiLCJhIjoiY21xcHptODEyMGJydDJycWFhaWY0ZHVsMCJ9.aJvnELJlXEs3nYrWx4Eg5Q";
  mapboxgl.accessToken = MAPBOX_TOKEN;

  const PLACEMENT_FILES = [
    'placements_day1_ticks1_50.json','placements_day1_ticks51_100.json','placements_day1_ticks101_225.json',
    'placements_day2_ticks226_300.json','placements_day2_ticks301_375.json','placements_day2_ticks376_450.json',
    'placements_day3_ticks451_520.json','placements_day3_ticks521_600.json','placements_day3_ticks601_675.json',
  ];
  const OOB_FILES = [
    'union_regiments_i_ii_corps.json','union_regiments_iii_v_corps.json','union_regiments_vi_xi_xii_corps.json',
    'confederate_regiments_first_corps.json','confederate_regiments_second_corps.json','confederate_regiments_third_corps.json',
  ];

  const responses = await Promise.all(PLACEMENT_FILES.map(f => fetch('/data/' + f).then(r => r.json())));
  const oobResponses = await Promise.all(OOB_FILES.map(f => fetch('/data/oob/' + f).then(r => r.json())));

  const byUnit = new Map();
  for (const fileData of responses) {
    for (const p of fileData.placements) {
      if (!byUnit.has(p.unit_id)) byUnit.set(p.unit_id, []);
      byUnit.get(p.unit_id).push(p);
    }
  }
  for (const arr of byUnit.values()) arr.sort((a,b) => a.tick - b.tick);

  // Populate unit dropdown from real OOB data
  const unitNames = new Map();
  for (const fileData of oobResponses) {
    for (const r of fileData.regiments) unitNames.set(r.regiment_id, r.designation);
  }
  const select = document.getElementById('unit-select');
  const sortedUnitIds = [...unitNames.keys()].filter(id => byUnit.has(id)).sort((a,b) => unitNames.get(a).localeCompare(unitNames.get(b)));
  for (const id of sortedUnitIds) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = unitNames.get(id);
    select.appendChild(opt);
  }
  // Default to a well-known unit if present
  if (unitNames.has('U-20ME')) select.value = 'U-20ME';

  function placementAtTick(unitId, tick) {
    const arr = byUnit.get(unitId);
    if (!arr) return null;
    let lo = 0, hi = arr.length - 1, best = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid].tick <= tick) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best >= 0 ? arr[best] : null;
  }

  function allPlacementsAtTick(tick) {
    const result = [];
    for (const unitId of byUnit.keys()) {
      const p = placementAtTick(unitId, tick);
      if (p) result.push(p);
    }
    return result;
  }

  // Director mode: cluster active units into a grid, fly to the densest cell each tick.
  function densestClusterBounds(tick) {
    const placements = allPlacementsAtTick(tick);
    if (placements.length === 0) return null;
    const CELL = 0.01; // ~1km grid cells
    const cells = new Map();
    for (const p of placements) {
      const key = Math.round(p.lat / CELL) + ',' + Math.round(p.lng / CELL);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(p);
    }
    let best = null, bestCount = 0;
    for (const [key, group] of cells.entries()) {
      if (group.length > bestCount) { bestCount = group.length; best = group; }
    }
    const lats = best.map(p => p.lat), lngs = best.map(p => p.lng);
    return [[Math.min(...lngs) - 0.006, Math.min(...lats) - 0.006], [Math.max(...lngs) + 0.006, Math.max(...lats) + 0.006]];
  }

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-v9',
    center: [-77.235, 39.81],
    zoom: 13,
  });
  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

  let currentMode = 'director';
  let tick = 1;
  let playing = false;
  let intervalId = null;

  map.on('load', () => {
    map.addSource('cam-units', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'cam-units-layer', type: 'circle', source: 'cam-units',
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['get', 'strength'], 0, 3, 500, 5, 2000, 9, 6000, 14],
        'circle-color': ['match', ['get', 'side'], 'union', '#4477cc', 'confederate', '#cc5544', '#888888'],
        'circle-stroke-width': 1, 'circle-stroke-color': '#0a0a14',
      }
    });
    map.addLayer({
      id: 'cam-follow-highlight', type: 'circle', source: 'cam-units',
      filter: ['==', ['get', 'isFollowed'], true],
      paint: { 'circle-radius': 16, 'circle-color': 'transparent', 'circle-stroke-width': 2, 'circle-stroke-color': '#ffdd66' }
    });
    render();
  });

  function hourForTick(tick) {
    const dayStartTick = tick <= 225 ? 1 : (tick <= 450 ? 226 : 451);
    const minutesIn = (tick - dayStartTick) * 5;
    return (Math.floor(minutesIn / 60) + 5) % 24; // ticks are 5-min intervals starting 5:00am each day
  }

  function atmosphereForHour(hour) {
    // Simple, defensible dawn/day/dusk/night color model -- not meteorological data (none exists in the dataset),
    // just a lighting-mood overlay based on time of day.
    if (hour >= 5 && hour < 7) return 'rgba(255,170,100,0.18)';   // dawn
    if (hour >= 7 && hour < 17) return 'rgba(255,255,255,0)';      // full daylight, no tint
    if (hour >= 17 && hour < 20) return 'rgba(255,120,60,0.22)';   // dusk
    return 'rgba(20,30,70,0.45)';                                   // night
  }

  function render() {
    const placements = allPlacementsAtTick(tick);
    const followedId = currentMode === 'follow' ? select.value : null;
    map.getSource('cam-units').setData({
      type: 'FeatureCollection',
      features: placements.map(p => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
        properties: { unit_id: p.unit_id, side: p.unit_id.startsWith('U-') ? 'union' : 'confederate', strength: p.strength, isFollowed: p.unit_id === followedId }
      }))
    });
    document.getElementById('tick-num').textContent = tick;
    document.getElementById('atmosphere').style.background = atmosphereForHour(hourForTick(tick));

    if (currentMode === 'director') {
      const bounds = densestClusterBounds(tick);
      if (bounds) map.fitBounds(bounds, { padding: 60, duration: 800, maxZoom: 15 });
    } else {
      const p = placementAtTick(followedId, tick);
      if (p) map.flyTo({ center: [p.lng, p.lat], zoom: 15, duration: 800 });
    }
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      select.style.display = currentMode === 'follow' ? 'inline-block' : 'none';
      render();
    });
  });
  select.addEventListener('change', render);

  const playBtn = document.getElementById('play-btn');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.classList.toggle('playing', playing);
    playBtn.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
    if (playing) {
      intervalId = setInterval(() => {
        tick = tick >= 675 ? 1 : tick + 1;
        render();
      }, 1000);
    } else {
      clearInterval(intervalId);
    }
  });
})();
</script>
<div id="gtbg-footer-mount"></div>
<script src="/site-nav.js" data-current="camera"></script>
</body>
</html>
