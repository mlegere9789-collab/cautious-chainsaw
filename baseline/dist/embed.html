<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a14" />
<title>Gettysburg — Embedded Moment</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0a14; color:#e8e6df; font-family: Georgia, serif; }
  .embed { padding: 18px 20px; border: 1px solid #1a1a2a; border-radius: 10px; max-width: 480px; }
  .eyebrow { font-family: sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #c9a24b; margin-bottom: 8px; }
  .headline { font-size: 18px; color: #e8d5a3; margin-bottom: 8px; line-height: 1.3; }
  .blurb { font-family: sans-serif; font-size: 13px; color: #aaa; line-height: 1.6; margin-bottom: 14px; }
  .cta { display:inline-block; font-family: sans-serif; font-size: 13px; font-weight:bold; color:#fff; background:#1a3a7a; padding: 8px 16px; border-radius: 6px; text-decoration:none; }
  .brand { font-family: sans-serif; font-size: 10px; color: #555; margin-top: 14px; letter-spacing: 1px; }
  .brand a { color: #777; }
  #loading, #error { font-family: sans-serif; font-size: 12px; color: #888; padding: 20px; }
  #error { display:none; }
</style>
</head>
<body>
<div class="embed">
  <div id="loading">Loading&hellip;</div>
  <div id="error">Couldn't load this moment.</div>
  <div id="content" style="display:none;">
    <div class="eyebrow" id="e-eyebrow">Gettysburg, July 1&ndash;3, 1863</div>
    <div class="headline" id="e-headline"></div>
    <div class="blurb" id="e-blurb"></div>
    <a class="cta" id="e-cta" href="https://gettysburginteractivemap.com/" target="_top">Explore the full animated map &rarr;</a>
    <div class="brand"><a href="https://gettysburginteractivemap.com/" target="_top">gettysburginteractivemap.com</a></div>
  </div>
</div>

<script>
(async function() {
  // Usage: embed.html?vignette=V-018  (embeds a specific vignette)
  //        embed.html                 (embeds today's "on this day" pick, same logic as the landing-page widget)
  try {
    const params = new URLSearchParams(window.location.search);
    const requestedVignetteId = params.get('vignette');

    const files = ['vignettes_part1.json', 'vignettes_part2.json', 'vignettes_part3.json'];
    const results = await Promise.all(files.map(f => fetch('/data/' + f).then(r => r.json())));
    const allVignettes = results.flatMap(r => r.vignettes);

    let pick;
    if (requestedVignetteId) {
      pick = allVignettes.find(v => v.vignette_id === requestedVignetteId);
      if (!pick) throw new Error('vignette id not found: ' + requestedVignetteId);
    } else {
      const now = new Date();
      const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
      pick = allVignettes[dayOfYear % allVignettes.length];
    }

    document.getElementById('e-headline').textContent = pick.title;
    document.getElementById('e-blurb').textContent = pick.panel_summary;
    document.getElementById('e-cta').href = 'https://gettysburginteractivemap.com/index.html?tick=' + pick.trigger_tick + '&vignette=' + encodeURIComponent(pick.vignette_id);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (err) {
    console.error('Embed widget error:', err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
})();
</script>
</body>
</html>
