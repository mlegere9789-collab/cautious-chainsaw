<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a14" />
<title>The Living Ledger — Gettysburg Animated Battlefield Map</title>
<meta name="description" content="Watch the human cost of the battle rise minute by minute, tied to the same casualty data behind the main map." />
<link rel="canonical" href="https://gettysburginteractivemap.com/living-ledger.html" />
<meta property="og:title" content="The Living Ledger — Gettysburg Animated Battlefield Map" />
<meta property="og:description" content="Watch the human cost of the battle rise minute by minute." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://gettysburginteractivemap.com/living-ledger.html" />
<meta property="og:image" content="https://gettysburginteractivemap.com/screenshots/day3.png" />
<link rel="stylesheet" href="/site-nav.css">
<style>
  :root { --bg:#0a0a14; --panel:#12121e; --ink:#e8e6df; --gold:#c9a24b; --muted:#8a93a8; --line:#1e1e2e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, serif; }
  header { padding: 24px 5% 10px; }
  header a.back { font-family: sans-serif; font-size: 12px; color: var(--muted); text-decoration:none; }
  h1 { font-size: clamp(22px, 3.5vw, 32px); color: var(--gold); margin: 10px 0 6px; }
  .sub { font-family: sans-serif; color: var(--muted); font-size: 13px; max-width: 640px; }
  main { padding: 30px 5% 60px; max-width: 780px; margin: 0 auto; text-align: center; }
  .clock { font-family: sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .count {
    font-family: Georgia, serif; font-weight: 700;
    font-size: clamp(3.5rem, 14vw, 8rem); line-height: 1; margin: 10px 0;
    color: #e8d5a3; text-shadow: 0 4px 40px rgba(200,80,60,0.25);
    font-variant-numeric: tabular-nums;
  }
  .count-lbl { font-family: sans-serif; font-size: 13px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .split { display: flex; justify-content: center; gap: 40px; margin-top: 26px; font-family: sans-serif; }
  .split .s-num { font-size: 26px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .split .s-num.union { color: #6f97e0; }
  .split .s-num.conf { color: #e08b7a; }
  .split .s-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  #callout {
    margin-top: 34px; min-height: 70px; padding: 16px 24px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; font-family: sans-serif;
    font-size: 14px; color: #ddd; line-height: 1.6; opacity: 0; transition: opacity 0.5s;
  }
  #callout.show { opacity: 1; }
  #callout b { color: var(--gold); }
  .controls { display: flex; justify-content: center; gap: 12px; align-items: center; margin-top: 30px; font-family: sans-serif; }
  .ctl-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; font-family: sans-serif; font-size: 13px; }
  .ctl-btn.primary { background: var(--gold); color: #0a0a14; border-color: var(--gold); font-weight: bold; }
  .ctl-btn:hover:not(.primary) { border-color: var(--gold); }
  #progress { width: 100%; max-width: 560px; margin: 26px auto 0; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6b7da3, #c9a24b); transition: width 0.2s linear; }
  #loading { font-family: sans-serif; color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<div id="gtbg-nav-mount"></div>
<header>
  <a class="back" href="/">&larr; Back to the map</a>
  <h1>The Living Ledger</h1>
  <p class="sub">A running toll of the battle's human cost, rising minute by minute across the same three days -- built from the same casualty data behind the Casualty Dashboard.</p>
</header>
<main>
  <div id="loading">Loading casualty data&hellip;</div>
  <div id="content" style="display:none;">
    <div class="clock" id="clock">July 1, 5:00 AM</div>
    <div class="count" id="count">0</div>
    <div class="count-lbl">Total casualties, both armies</div>
    <div class="split">
      <div><div class="s-num union" id="s-union">0</div><div class="s-lbl">Union</div></div>
      <div><div class="s-num conf" id="s-conf">0</div><div class="s-lbl">Confederate</div></div>
    </div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="callout"></div>
    <div class="controls">
      <button class="ctl-btn" id="reset-btn" type="button">Restart</button>
      <button class="ctl-btn primary" id="play-btn" type="button">&#9654; Play</button>
      <select id="speed" class="ctl-btn" style="cursor:pointer;">
        <option value="80">1x</option>
        <option value="30" selected>3x</option>
        <option value="10">10x</option>
      </select>
    </div>
  </div>
</main>
<div id="gtbg-footer-mount"></div>
<script src="/site-nav.js" data-current="living-ledger"></script>

<script>
(async function() {
  const TOTAL_TICKS = 675;
  const DAY_BOUNDS = [1, 226, 451, 676];

  const [casualty, vig1, vig2, vig3] = await Promise.all([
    fetch('/data/casualty_apportionment.json').then(r => r.json()),
    fetch('/data/vignettes_part1.json').then(r => r.json()),
    fetch('/data/vignettes_part2.json').then(r => r.json()),
    fetch('/data/vignettes_part3.json').then(r => r.json()),
  ]);
  const vignettes = [...vig1.vignettes, ...vig2.vignettes, ...vig3.vignettes].sort((a,b) => a.trigger_tick - b.trigger_tick);

  // Build a per-side cumulative casualty curve across all 675 ticks by walking each
  // corps's engagement_periods (same source the Casualty Dashboard chart plots).
  function buildCurve(corpsList) {
    const points = new Array(TOTAL_TICKS + 1).fill(0);
    for (const corps of corpsList) {
      const sorted = [...corps.engagement_periods].sort((a,b) => a.tick_range[0] - b.tick_range[0]);
      for (const period of sorted) {
        const [start, end] = period.tick_range;
        const span = Math.max(1, end - start);
        for (let t = start; t <= end && t <= TOTAL_TICKS; t++) {
          // linear ramp of this period's casualties across its own tick range
          points[t] += period.casualties / span;
        }
      }
    }
    // convert per-tick increments into a cumulative running total
    let running = 0;
    return points.map(v => (running += v));
  }

  const unionCurve = buildCurve(casualty.union_corps);
  const confCurve = buildCurve(casualty.confederate_corps);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const clockEl = document.getElementById('clock');
  const countEl = document.getElementById('count');
  const unionEl = document.getElementById('s-union');
  const confEl = document.getElementById('s-conf');
  const barEl = document.getElementById('progress-bar');
  const calloutEl = document.getElementById('callout');
  const playBtn = document.getElementById('play-btn');
  const speedSel = document.getElementById('speed');

  function timeForTick(tick) {
    const dayIdx = tick < DAY_BOUNDS[1] ? 0 : (tick < DAY_BOUNDS[2] ? 1 : 2);
    const dayStart = DAY_BOUNDS[dayIdx];
    const minutesIn = (tick - dayStart) * 5;
    const hour = Math.floor(minutesIn / 60) + 5;
    const min = minutesIn % 60;
    const h12 = ((hour + 11) % 12) + 1;
    const ampm = hour >= 12 ? 'PM' : 'AM';
    return `July ${dayIdx + 1}, ${h12}:${String(min).padStart(2, '0')} ${ampm}`;
  }

  let tick = 1, playing = false, intervalId = null, lastCalloutTick = 0;

  function render() {
    const u = Math.round(unionCurve[tick]);
    const c = Math.round(confCurve[tick]);
    clockEl.textContent = timeForTick(tick);
    countEl.textContent = (u + c).toLocaleString();
    unionEl.textContent = u.toLocaleString();
    confEl.textContent = c.toLocaleString();
    barEl.style.width = (tick / TOTAL_TICKS * 100).toFixed(1) + '%';

    const due = vignettes.find(v => v.trigger_tick > lastCalloutTick && v.trigger_tick <= tick);
    if (due) {
      lastCalloutTick = due.trigger_tick;
      calloutEl.innerHTML = `<b>${due.trigger_location}, tick ${due.trigger_tick}:</b> ${due.panel_summary}`;
      calloutEl.classList.add('show');
    }
  }

  function step() {
    tick = Math.min(TOTAL_TICKS, tick + 1);
    render();
    if (tick >= TOTAL_TICKS) stop();
  }

  function stop() {
    playing = false;
    clearInterval(intervalId);
    playBtn.innerHTML = '&#9654; Play';
    playBtn.classList.add('primary');
  }

  playBtn.addEventListener('click', () => {
    if (playing) { stop(); return; }
    playing = true;
    playBtn.innerHTML = '&#10074;&#10074; Pause';
    intervalId = setInterval(step, Number(speedSel.value));
  });
  speedSel.addEventListener('change', () => {
    if (playing) { clearInterval(intervalId); intervalId = setInterval(step, Number(speedSel.value)); }
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    stop(); tick = 1; lastCalloutTick = 0;
    calloutEl.classList.remove('show');
    render();
  });

  render();
})();
</script>
</body>
</html>
