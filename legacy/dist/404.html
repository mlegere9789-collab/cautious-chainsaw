<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a14" />
<meta name="robots" content="noindex" />
<title>Page Not Found — Gettysburg Animated Battlefield Map</title>
<style>
  :root { --bg:#0a0a14; --panel:#12121e; --ink:#e8e6df; --gold:#c9a24b; --muted:#8a93a8; --line:#1e1e2e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; display:flex; align-items:center; justify-content:center; text-align:center; padding: 24px; }
  .wrap { max-width: 520px; }
  .eyebrow { font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); color: var(--gold); margin: 0 0 12px; }
  p { font-family: system-ui, sans-serif; color: #ccc; font-size: 15px; line-height: 1.6; margin: 0 0 26px; }
  a.cta { display:inline-block; font-family: system-ui, sans-serif; font-weight:bold; font-size:14px; background: var(--gold); color:#0a0a14; padding: 12px 26px; border-radius: 8px; text-decoration:none; }
  a.cta:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">July 1&ndash;3, 1863</div>
    <h1>This ground isn't on the map.</h1>
    <p>The page you're looking for doesn't exist, or the link that brought you here was wrong. The battle itself is still right where you left it.</p>
    <a class="cta" href="/">&larr; Back to the map</a>
  </div>
</body>
</html>
