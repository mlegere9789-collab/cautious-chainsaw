="350" fill="#555">frame number (16.7 ms each). Before frame 31 the unit holds still although its tick is running; its keyframe then arrives as one jump (frame 31);</text><text x="60" y="366" fill="#555">the next tick (frame 60) draws the unit back at the start of the segment for one frame, then jumps it to the end (frame 61).</text></svg>