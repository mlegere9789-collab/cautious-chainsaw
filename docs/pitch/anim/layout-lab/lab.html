<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout lab</title>
<style>
  :root { color-scheme: dark; --bg:#0c1117; --panel:#121923; --line:#243142; --ink:#e6edf6; --mute:#8fa1b6; --gold:#e8d5a3; --ok:#4ad28a; --bad:#ff5a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 "Segoe UI",system-ui,Arial,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; margin:0 8px 0 0; color:var(--gold); letter-spacing:.04em; }
  label { display:flex; align-items:center; gap:6px; color:var(--mute); }
  select, input[type=range], button { accent-color:#e8d5a3; }
  select, button { background:#182231; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:#3b5169; }
  #stage { position:relative; margin:10px 14px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#10151c; touch-action:none; cursor:grab; }
  #stage svg { display:block; }
  #hud { position:absolute; right:10px; top:10px; background:rgba(12,17,23,.86); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:236px; pointer-events:none; }
  #hud b { color:var(--gold); } #hud .row { display:flex; justify-content:space-between; gap:14px; } .ok { color:var(--ok); font-weight:700; } .bad { color:var(--bad); font-weight:700; }
  #log { margin:0 14px 14px; color:var(--mute); white-space:pre-wrap; font:12px/1.4 ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<header>
  <h1>LAYOUT LAB</h1>
  <label>tick <input id="tick" type="range" min="1" max="675" value="346" style="width:240px"><output id="tickv">346</output></label>
  <label>zoom <input id="zoom" type="range" min="11" max="17" step="0.05" value="14" style="width:150px"><output id="zoomv">14.00</output></label>
  <label>strategy
    <select id="strategy">
      <option value="hybrid" selected>hybrid (recommended)</option><option value="raw">raw (true positions)</option><option value="legacy">legacy (as shipped)</option><option value="disclose">(d) disclosure only</option>
      <option value="displace">(b) displacement only</option><option value="aggregate">(a) aggregation only</option><option value="aggregateTier">(a) semantic zoom tiers</option><option value="fanout">(c) fan-out rosters</option>
    </select></label>
  <label>visibility <select id="rule"><option value="A" selected>A carry-forward (shipped)</option><option value="B">B latest snapshot</option><option value="C">C 24-tick window</option></select></label>
  <label>footprint <select id="spec"><option value="standard" selected>standard</option><option value="compact">compact</option></select></label>
  <label>dMax <input id="dmax" type="range" min="0" max="96" step="4" value="48" style="width:110px"><output id="dmaxv">48</output></label>
  <button id="play">play</button>
  <label>speed <select id="speed"><option value="2">1x</option><option value="8">4x</option><option value="32">16x</option></select></label>
  <button data-h="346,39.8189,-77.2262,14">H1 Cemetery Hill</button><button data-h="293,39.7994,-77.2417,14">H2 Rose Woods</button><button data-h="556,39.8117,-77.2347,14">H3 The Angle</button>
</header>
<div id="stage"><div id="view"></div><div id="hud"></div></div>
<pre id="log">loading data ...</pre>
<script type="module" src="lab.mjs"></script>
</body>
</html>
