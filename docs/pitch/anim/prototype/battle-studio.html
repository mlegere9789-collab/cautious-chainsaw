<!doctype html>

<title>Battle Studio</title>
<meta name="description" content="A shared animation engine for the Gettysburg battle map: real placements, a certified no-overlap layout, continuous time and a live Tuning Studio. Prototype, schematic backdrop.">
<style>
/* Battle Studio chrome.  The map is a canvas; everything here is the instrument around it. System fonts only, no external requests. */
:root {
  --bg: #0e1115; --panel: #151a20; --panel2: #1b2128; --line: #2a323c; --text: #e9edf2; --muted: #9ba6b2; --faint: #6d7782; --accent: #f2b700; --accent-ink: #1a1400;
  --ok: #3aa675; --warn: #e09a1a; --bad: #e0553a; --blue: #4d8fe0;
  --ev-Documented: #3aa675; --ev-Measured: #2fa3b8; --ev-Computed: #6f8fc9; --ev-Modelled: #d9a21b; --ev-Contested: #e0703a; --ev-Unknown: #8b94a0; --ev-Design: #9b7fd6;
  --radius: 10px; --gutter: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e9e6df; --panel: #ffffff; --panel2: #f3f1ec; --line: #d6d1c6; --text: #1d2126; --muted: #566069; --faint: #858d96; --accent-ink: #1a1400; color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #e9e6df; --panel: #ffffff; --panel2: #f3f1ec; --line: #d6d1c6; --text: #1d2126; --muted: #566069; --faint: #858d96; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
#app { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
.pane, #metrics, .scrubtip { user-select: text; -webkit-user-select: text; }
#map { position: absolute; inset: 0; display: block; touch-action: none; cursor: grab; outline: none; }
#map.dragging { cursor: grabbing; } #map.over-tile { cursor: pointer; }
#popups { position: absolute; inset: 0; pointer-events: none; }
.hidden { display: none !important; }

/* top bar */
#topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 10px var(--gutter); pointer-events: none; }
#topbar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 12px; backdrop-filter: blur(8px); }
.brand b { font-size: 14px; letter-spacing: .2px; } .brand span { color: var(--muted); font-size: 11px; }
.clockbox { display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; min-width: 0; backdrop-filter: blur(8px); }
.clockbox .tick { font: 600 15px var(--mono); letter-spacing: .3px; } .clockbox .clock { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.btn { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; backdrop-filter: blur(8px); }
.btn:hover { border-color: var(--faint); } .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
select.btn { padding-right: 24px; max-width: 220px; }

/* dock */
#dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(980px, calc(100% - 2 * var(--gutter))); background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 12px; backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.28); }
.transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.transport .grp { display: flex; gap: 4px; }
.tbtn { min-width: 36px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); display: grid; place-items: center; padding: 0 9px; }
.tbtn:hover { border-color: var(--faint); } .tbtn.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 44px; }
.tbtn[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.tbtn svg { width: 16px; height: 16px; fill: currentColor; }
.speeds .tbtn { min-width: 38px; font: 600 12px var(--mono); }
.dockstat { margin-left: auto; color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
.scrub { position: relative; height: 38px; margin-top: 8px; }
.scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.scrub input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; cursor: ew-resize; }
.scrub input[type=range]::-webkit-slider-runnable-track { height: 38px; background: transparent; }
.scrub input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 38px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
.scrub input[type=range]::-moz-range-track { height: 38px; background: transparent; } .scrub input[type=range]::-moz-range-thumb { width: 4px; height: 38px; border: 0; border-radius: 2px; background: var(--accent); }
.scrubtip { position: absolute; bottom: 44px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; max-width: 320px; pointer-events: none; white-space: normal; z-index: 5; }
.honesty { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

/* evidence badges */
.ev { display: inline-block; font: 600 10px var(--font); letter-spacing: .3px; text-transform: uppercase; border-radius: 999px; padding: 1px 7px; border: 1px solid currentColor; vertical-align: 1px; white-space: nowrap; }
.ev-Documented { color: var(--ev-Documented); } .ev-Measured { color: var(--ev-Measured); } .ev-Computed { color: var(--ev-Computed); } .ev-Modelled { color: var(--ev-Modelled); }
.ev-Contested { color: var(--ev-Contested); } .ev-Unknown { color: var(--ev-Unknown); } .ev-Design { color: var(--ev-Design); }

/* panel */
#panel { position: absolute; top: 64px; right: 12px; bottom: 124px; width: 360px; max-width: calc(100% - 24px); display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 95%, transparent); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.3); backdrop-filter: blur(10px); overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); } .tabs button { flex: 1; background: none; border: 0; padding: 10px 6px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.pane { flex: 1; overflow: auto; padding: 10px 12px 14px; scrollbar-width: thin; }
.pane h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.pane h3 button { background: none; border: 0; color: inherit; padding: 0; text-transform: inherit; letter-spacing: inherit; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.row label { font-weight: 500; } .row .val { font: 12px var(--mono); color: var(--accent); min-width: 54px; text-align: right; }
.row .doc { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.row select { grid-column: 1 / -1; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.row.changed label::after { content: ' \25CF'; color: var(--accent); font-size: 9px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; } .toolbar .btn { padding: 5px 9px; font-size: 12px; }
.search { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 3px 10px; font-size: 12px; margin: 6px 0; } .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.legend { display: grid; grid-template-columns: 22px 1fr; gap: 7px 9px; align-items: start; font-size: 12px; margin: 6px 0; } .legend i { width: 18px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,.35); display: block; margin-top: 2px; }
.note { color: var(--muted); font-size: 12px; } .note b { color: var(--text); }
.warnbox { border: 1px solid color-mix(in srgb, var(--ev-Modelled) 60%, transparent); background: color-mix(in srgb, var(--ev-Modelled) 10%, transparent); border-radius: 8px; padding: 8px 10px; font-size: 12px; margin: 8px 0; }

/* metrics overlay */
#metrics { position: absolute; left: var(--gutter); top: 74px; width: 318px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 9px; font: 11.5px var(--mono); backdrop-filter: blur(8px); }
#metrics canvas { width: 100%; height: 54px; display: block; margin: 4px 0 6px; } #metrics .mrow { display: flex; justify-content: space-between; gap: 8px; } #metrics .mrow span:first-child { color: var(--muted); }
#metrics .good { color: var(--ok); } #metrics .bad { color: var(--bad); } #metrics .btns { display: flex; gap: 6px; margin-top: 6px; } #metrics .btns button { flex: 1; padding: 4px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }

/* popups layer (registry host) */
.pcard { position: absolute; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; box-shadow: 0 6px 22px rgba(0,0,0,.3); font-size: 12px; }
#leaders { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }

.honesty-mini { display: none; }
@media (max-width: 760px) {
  :root { --gutter: 10px; }
  #topbar { flex-wrap: wrap; gap: 6px; padding: 8px var(--gutter); }
  .brand, .spacer, .dockstat { display: none; }
  .clockbox { flex: 1 1 100%; padding: 5px 10px; } .clockbox .tick { font-size: 14px; }
  #topbar select.skin-sel { display: none; }
  #topbar select.btn { flex: 1 1 0; min-width: 0; padding: 6px 22px 6px 8px; font-size: 12px; max-width: none; }
  #topbar .btn:not(select) { padding: 6px 9px; font-size: 12px; }
  #dock { bottom: 8px; padding: 8px 10px 9px; width: calc(100% - 2 * var(--gutter)); }
  .honesty { display: none; } .honesty-mini { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .transport { gap: 6px; } .tbtn { height: 30px; min-width: 30px; padding: 0 6px; } .tbtn.play { width: 38px; } .speeds .tbtn { min-width: 30px; padding: 0 4px; font-size: 11px; }
  .scrub { height: 30px; margin-top: 6px; } .scrub input[type=range]::-webkit-slider-runnable-track, .scrub input[type=range]::-webkit-slider-thumb { height: 30px; } .scrub input[type=range]::-moz-range-track, .scrub input[type=range]::-moz-range-thumb { height: 30px; }
  #panel { top: auto; right: 8px; left: 8px; width: auto; bottom: 138px; height: 44vh; max-width: none; }
  #metrics { top: 108px; width: 280px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

</style>
</head>

nd of Day 1","Vermont Brigade on Cemetery Ridge -- Stannard will use them tomorrow","Vermont Brigade (Stannard) on Cemetery Ridge","Vermont Brigade -- Stannard sees the ground he will use tomorrow for the flanking attack","Vermont Brigade in position -- Stannard watching the Confederate line","Vermont Brigade watching Confederate line -- Stannard ready","Vermont Brigade -- double flanking maneuver complete","Vermont Brigade on Cemetery Ridge -- battle effectively over","Vermont Brigade -- flanking maneuver complete, back in line","Vermont Brigade. Stannard's double enfilade decided the charge. End of battle.","Hancock commanding the Union center -- he has been everywhere on Cemetery Ridge all afternoon, riding the line","HANCOCK WOUNDED -- shot through the saddle. A nail and wood fragments driven into his thigh. He will not leave the field.","Hancock still commanding despite wound -- he has tourniquet applied but stays until he sees the charge broken completely","Hancock finally carried from the field -- he sends Meade a note: the repulse is total and the enemy is retreating","Gibbon now commanding II Corps -- Hancock in the ambulance. The corps that stopped Pickett exhausted.","Caldwell's entire II Corps division countercharging -- Cross, Kelly, Zook, Brooke all in","Caldwell's II Corps division on Cemetery Ridge -- the survivors of Wheatfield fighting","Cross's brigade rushing to Wheatfield -- Cross about to die here","Cross KIA in Wheatfield -- McKeen assumes command. Commander succession US-009.","Caldwell's division countercharging -- Hancock has sent every man he has","Irish Brigade -- Father Corby's absolution about to occur","Irish Brigade in Wheatfield","Zook's brigade -- Zook about to be mortally wounded","Zook mortally wounded -- Fraser assumes command. US-010.","Brooke's brigade","Brooke's brigade pushing farthest into Wheatfield","Gibbon's division holding Cemetery Ridge -- the men who will face Pickett tomorrow","Gibbon's division overnight -- the men rge at Culp's Hill","tick":460,"place":"Culp's Hill meadow","lat":39.8117,"lng":-77.22},{"id":"V-017","title":"The Cannonade","tick":518,"place":"Seminary Ridge","lat":39.8183,"lng":-77.2461},{"id":"V-015","title":"Alexander's Two Messages","tick":525,"place":"Seminary Ridge","lat":39.8183,"lng":-77.2456},{"id":"V-016","title":"Armistead at The Angle","tick":551,"place":"The Angle, Cemetery Ridge","lat":39.8117,"lng":-77.235},{"id":"V-018","title":"Cushing's Battery","tick":553,"place":"The Angle, Cemetery Ridge","lat":39.8117,"lng":-77.235},{"id":"V-019","title":"Pickett's Return","tick":556,"place":"Seminary Ridge","lat":39.8183,"lng":-77.2461},{"id":"V-023","title":"Lee Meets His Men","tick":556,"place":"Open fields west of Cemetery Ridge","lat":39.815,"lng":-77.245},{"id":"V-020","title":"Custer at East Cavalry Field","tick":563,"place":"East Cavalry Field","lat":39.8317,"lng":-77.1972},{"id":"V-021","title":"Farnsworth's Charge","tick":568,"place":"South of Big Round Top","lat":39.7833,"lng":-77.2428},{"id":"V-024","title":"The High Water Mark","tick":675,"place":"Cemetery Ridge -- The Angle","lat":39.8117,"lng":-77.235}],"scenes":[{"id":"carry1","name":"Pile A (carry-forward)","tick":295,"tick0":287,"tick1":307,"zoom":15,"lat":39.7989,"lng":-77.2411,"nearestPlace":{"name":"The Wheatfield","d":79},"why":"19 units within 120 m of one unit at tick 295 under carry-forward (344 on the field); most of them have an old keyframe","unitsWithin":19,"onField":344,"rule":"carry-forward"},{"id":"carry2","name":"Pile B (carry-forward)","tick":328,"tick0":320,"tick1":340,"zoom":15,"lat":39.8189,"lng":-77.2261,"nearestPlace":{"name":"Evergreen Cemetery gatehouse","d":67},"why":"19 units within 120 m of one unit at tick 328 under carry-forward (383 on the field); most of them have an old keyframe","unitsWithin":19,"onField":383,"rule":"carry-forward"},{"id":"carry3","name":"Pile C (carry-forward)","tick":64,"tick0":56,"tick1":76,"zoom":15,"lat":39.825,"lng":-77.2461,"nearestPlace":{"name":"Lutheran Theological Seminary","d":130},"why":"8 units within 120 m of one unit at tick 64 under carry-forward (143 on the field); most of them have an old keyframe","unitsWithin":8,"onField":143,"rule":"carry-forward"},{"id":"fresh1","name":"Contact A (fresh keyframes)","tick":451,"tick0":443,"tick1":463,"zoom":15.5,"lat":39.815,"lng":-77.2194,"nearestPlace":{"name":"Culp's Hill","d":247},"why":"8 of 26 keyframes recorded AT tick 451 lie within 120 m of one another","unitsWithin":8,"recorded":26,"rule":"fresh keyframes"},{"id":"fresh2","name":"Contact B (fresh keyframes)","tick":551,"tick0":543,"tick1":563,"zoom":15.5,"lat":39.8117,"lng":-77.235,"nearestPlace":{"name":"The Angle (High Water Mark)","d":0},"why":"8 of 10 keyframes recorded AT tick 551 lie within 120 m of one another","unitsWithin":8,"recorded":10,"rule":"fresh keyframes"},{"id":"fresh3","name":"Contact C (fresh keyframes)","tick":66,"tick0":58,"tick1":78,"zoom":15.5,"lat":39.8317,"lng":-77.23,"nearestPlace":{"name":"Barlow's Knoll","d":457},"why":"7 of 8 keyframes recorded AT tick 66 lie within 120 m of one another","unitsWithin":7,"recorded":8,"rule":"fresh keyframes"},{"id":"field","name":"Whole field (most tiles at once)","tick":620,"tick0":612,"tick1":632,"zoom":13.5,"lat":39.81592,"lng":-77.23677,"nearestPlace":{"name":"Codori Farm","d":358},"why":"478 units on the field, the maximum over 675 ticks under carry-forward","onField":478,"rule":"carry-forward"},{"id":"evening1","name":"Evening of day 1 (tick 120)","tick":120,"tick0":112,"tick1":132,"zoom":14,"lat":39.8189,"lng":-77.2261,"nearestPlace":{"name":"Evergreen Cemetery gatehouse","d":67},"why":"tick 120: 210 units on the field, 14 within 120 m of one unit; the densest tick under the latest-snapshot rule per 03-data-fuel.md","unitsWithin":14,"onField":210,"rule":"carry-forward"}]}</script>
<script type="application/json" id="studio-tokens">{"format":"battle-studio-tokens/1","version":1,"groups":[{"id":"time","label":"Time and transport"},{"id":"interp","label":"Motion between keyframes"},{"id":"layout","label":"Layout: tiles never obscure"},{"id":"motion","label":"Display dynamics"},{"id":"camera","label":"Camera"},{"id":"scene","label":"Scene"},{"id":"skin","label":"Skin"},{"id":"backdrop","label":"Backdrop"},{"id":"metrics","label":"Metrics"}],"tokens":[{"id":"time.baseTps","group":"time","type":"number","label":"Ticks per second at 1x","default":2,"min":0.5,"max":8,"step":0.5,"unit":"ticks/s","doc":"How many ticks 1x plays per second. The site plays 500 ms per tick (2 ticks per second); the speed buttons multiply this.","evidence":"Documented","source":"docs/plan/specialists/app-time.md row J (bundle constant 500)"},{"id":"time.fixedHz","group":"time","type":"number","label":"Simulation step rate","default":120,"min":30,"max":240,"step":10,"unit":"Hz","doc":"The clock advances in exact steps of 1/rate seconds; the renderer interpolates between steps. Independent of the display refresh rate.","evidence":"Design"},{"id":"time.maxFrameMs","group":"time","type":"number","label":"Longest frame the clock accepts","default":100,"min":20,"max":500,"step":10,"unit":"ms","doc":"A frame longer than this (a stalled or hidden tab) advances the clock by this much only, so the battle cannot fast-forward after a stall.","evidence":"Design"},{"id":"time.speedRampMs","group":"time","type":"number","label":"Speed ease time","default":220,"min":0,"max":1000,"step":10,"unit":"ms","doc":"Play, pause and speed changes ease in and out over about this time (0 = instant).","evidence":"Design"},{"id":"time.glideMs","group":"time","type":"number","label":"Seek glide time","default":450,"min":0,"max":2000,"step":25,"unit":"ms","doc":"A seek or a jump to a scene flies the clock to the target with a critically damped glide of this time constant instead of teleporting.","evidence":"Design"},{"id":"time.glideMaxTps","group":"time","type":"number","label":"Seek glide speed cap","default":120,"min":10,"max":600,"step":10,"unit":"ticks/s","doc":"The glide never flies faster than this, so a long jump is a fly-through of the interpolated paths, not a blur.","evidence":"Design"},{"id":"time.endBehavior","group":"time","type":"select","label":"At the end of the battle","default":"stop","options":[{"value":"stop","label":"Stop at tick 675"},{"value":"loop","label":"Loop to tick 1"}],"doc":"What happens when playback reaches the last tick.","evidence":"Design"},{"id":"interp.model","group":"interp","type":"registry","registry":"interp","label":"Motion model","default":"pchip","doc":"How a unit moves between its own keyframes. All models are exact at every keyframe; between keyframes the position is Modelled.","evidence":"Modelled"},{"id":"interp.endSlopes","group":"interp","type":"select","label":"Start and stop","default":"rest","options":[{"value":"rest","label":"Start and stop at rest"},{"value":"edge","label":"Keep the edge velocity"}],"doc":"Whether a unit's track starts and ends at rest (eased) or with the velocity of its first and last segment.","evidence":"Modelled"},{"id":"interp.strengthTweenMs","group":"interp","type":"number","label":"Strength bar tween","default":350,"min":0,"max":1500,"step":25,"unit":"ms","doc":"When a unit's current keyframe changes its strength, the bar eases to the new value over this time. The value itself is the keyframe's, never interpolated into numbers that are not in the data.","evidence":"Design"},{"id":"layout.strategy","group":"layout","type":"registry","registry":"layout","label":"Layout strategy","default":"certified","doc":"Which layout module places the tiles. certified guarantees zero overlap; raw is a diagnostic that shows the unsolved problem.","evidence":"Design"},{"id":"layout.visibility","group":"layout","type":"select","label":"Which units are on the map","default":"carry","options":[{"value":"carry","label":"Carry forward (what the site draws today)"},{"value":"window","label":"Fresh keyframes only (within a window)"},{"value":"snapshot","label":"Latest snapshot only"}],"doc":"The visibility rule decides how many tiles exist at all (typical 384 under carry-forward, 44 under a window, 7 under the snapshot; 03-data-fuel.md section 9.1).","evidence":"Computed"},{"id":"layout.windowTicks","group":"layout","type":"number","label":"Fresh window","default":24,"min":1,"max":120,"step":1,"unit":"ticks","doc":"Under the window rule a unit is shown only within this many ticks before or after one of its own keyframes.","evidence":"Design"},{"id":"layout.dMaxPx","group":"layout","type":"number","label":"Displacement budget","default":48,"min":0,"max":120,"step":1,"unit":"px","doc":"How far a tile may sit from its true position so it can be read (a pin and a leader line stay on the true position). 0 = pure aggregation. Beyond the budget the tile is merged into an aggregate.","evidence":"Computed","source":"docs/pitch/anim/06-layout.md 4.4"},{"id":"layout.gapPx","group":"layout","type":"number","label":"Clearance between tiles","default":2,"min":0,"max":6,"step":0.5,"unit":"px","doc":"Minimum free space between any two tile boxes.","evidence":"Design"},{"id":"layout.bandPx","group":"layout","type":"number","label":"Split hysteresis band","default":12,"min":0,"max":40,"step":1,"unit":"px","doc":"An aggregate tries to split only when its members would fit within the budget minus this band, so it does not flicker.","evidence":"Design"},{"id":"layout.relaxPxPerSec","group":"layout","type":"number","label":"Return speed","default":120,"min":0,"max":600,"step":10,"unit":"px/s","doc":"How fast a displaced tile drifts back toward its true position when there is room.","evidence":"Design"},{"id":"layout.splitDwellMs","group":"layout","type":"number","label":"Aggregate dwell","default":500,"min":0,"max":3000,"step":50,"unit":"ms","doc":"An aggregate exists at least this long before a split is tried (merge now, split later).","evidence":"Design"},{"id":"layout.labelShowDelayMs","group":"layout","type":"number","label":"Label show delay","default":200,"min":0,"max":1500,"step":50,"unit":"ms","doc":"A name label may appear only after it has fitted for this long (it disappears at once when it stops fitting).","evidence":"Design"},{"id":"layout.labelCooldownMs","group":"layout","type":"number","label":"Label cool-down","default":1200,"min":0,"max":5000,"step":100,"unit":"ms","doc":"After a name label is hidden (something took its place) it may not come back for this long, so a label does not blink while tiles jostle.","evidence":"Design"},{"id":"layout.labelMinZoom","group":"layout","type":"number","label":"Labels from zoom","default":12,"min":8,"max":18,"step":0.5,"unit":"zoom","doc":"Below this zoom no name labels are drawn.","evidence":"Design"},{"id":"layout.kCap","group":"layout","type":"number","label":"Neighbourhood cap","default":60,"min":10,"max":200,"step":5,"unit":"obstacles","doc":"A neighbourhood with more obstacles than this is declared saturated and the tile aggregates (a conservative failure: never an overlap).","evidence":"Design"},{"id":"layout.pinProtect","group":"layout","type":"boolean","label":"Protect true positions","default":true,"doc":"No tile may cover another tile's true position.","evidence":"Design"},{"id":"layout.labels","group":"layout","type":"boolean","label":"Name labels","default":true,"doc":"Show the secondary name labels where they fit.","evidence":"Design"},{"id":"layout.continuityPx","group":"layout","type":"number","label":"Continuity radius","default":0,"min":0,"max":120,"step":1,"unit":"px per frame","doc":"EXPERIMENT. A tile that already has a place never jumps farther than this from it in one frame: when the only free place is farther it merges into an aggregate instead. Measured to multiply aggregate churn by ten at 14 px (see README), so it is off; the display layer travels instead. 0 = off.","evidence":"Design"},{"id":"layout.solveEvery","group":"layout","type":"select","label":"Solve cadence","default":"auto","options":[{"value":"auto","label":"Automatic (follows the frame time)"},{"value":"1","label":"Every frame"},{"value":"2","label":"Every second frame"},{"value":"3","label":"Every third frame"}],"doc":"How often the certified layout is re-solved. In between, the solved tiles move with their units (same offsets, new true positions) and every displayed frame is still verified. Automatic raises it when frames run long on a slow device and lowers it again when there is room.","evidence":"Design"},{"id":"layout.maxSplitTries","group":"layout","type":"number","label":"Split trials per frame","default":2,"min":1,"max":8,"step":1,"unit":"aggregates","doc":"At most this many aggregates try to split in one frame.","evidence":"Design"},{"id":"motion.mode","group":"motion","type":"registry","registry":"motion","label":"Display dynamics","default":"dynamics","doc":"dynamics = smooth glide with collision-aware pushing; spring = smooth glide only; snap = show the layout as solved (the lab behaviour, for comparison).","evidence":"Design"},{"id":"motion.smoothMs","group":"motion","type":"number","label":"Glide time","default":110,"min":0,"max":500,"step":5,"unit":"ms","doc":"Time constant of the glide that carries a tile to its newly solved position.","evidence":"Design"},{"id":"motion.maxSpeedPxPerSec","group":"motion","type":"number","label":"Glide speed cap","default":1600,"min":100,"max":6000,"step":100,"unit":"px/s","doc":"A displaced tile never glides faster than this.","evidence":"Design"},{"id":"motion.travelPx","group":"motion","type":"number","label":"Travel distance","default":24,"min":4,"max":120,"step":2,"unit":"px","doc":"A tile whose solved place is farther than this from where it stands does not push its way there: it dims below 0.5 opacity, glides through, and solidifies on arrival, so it neither obscures nor is obscured on the way.","evidence":"Design"},{"id":"motion.travelMs","group":"motion","type":"number","label":"Travel glide time","default":60,"min":10,"max":300,"step":5,"unit":"ms","doc":"Glide time constant of a dimmed travelling tile.","evidence":"Design"},{"id":"motion.dimOpacity","group":"motion","type":"number","label":"Travel opacity","default":0.42,"min":0.1,"max":0.49,"step":0.01,"unit":"opacity","doc":"Opacity of a travelling tile; must stay below 0.5, the opacity rule's threshold between solid and not solid.","evidence":"Design"},{"id":"motion.maxPushPx","group":"motion","type":"number","label":"Largest push","default":1.5,"min":0.5,"max":40,"step":0.5,"unit":"px per pass","doc":"A contact moves a tile by at most this much per pass, so tiles are eased apart instead of shoved. What still overlaps is repaired by the safety net.","evidence":"Design"},{"id":"motion.collisionIters","group":"motion","type":"number","label":"Collision passes","default":4,"min":0,"max":12,"step":1,"unit":"passes","doc":"Passes of the pushing solver per frame.","evidence":"Design"},{"id":"motion.fadeMs","group":"motion","type":"number","label":"Fade time","default":220,"min":0,"max":1000,"step":10,"unit":"ms","doc":"Duration of a tile's fade in or out. Two tiles that hand over to each other never both have opacity of 0.5 or more at once.","evidence":"Design"},{"id":"motion.birthScale","group":"motion","type":"number","label":"Birth size","default":0.6,"min":0.2,"max":1,"step":0.05,"unit":"x","doc":"A new tile grows from this fraction of its size, pushing its neighbours gently aside.","evidence":"Design"},{"id":"motion.labelFadeMs","group":"motion","type":"number","label":"Label fade time","default":140,"min":0,"max":600,"step":10,"unit":"ms","doc":"Fade of a name label.","evidence":"Design"},{"id":"motion.cutFadeMs","group":"motion","type":"number","label":"Cross-fade time of a cut","default":140,"min":0,"max":600,"step":10,"unit":"ms","doc":"When the picture changes too much for a glide (a jump in time or zoom) the old tiles fade out and the new ones fade in, in sequence.","evidence":"Design"},{"id":"motion.cutZoomJump","group":"motion","type":"number","label":"Zoom jump that cuts","default":0.6,"min":0.1,"max":3,"step":0.1,"unit":"zoom levels per frame","doc":"A zoom change larger than this in one frame is a cut (cross-fade) instead of a glide.","evidence":"Design"},{"id":"motion.cutTickJump","group":"motion","type":"number","label":"Time jump that cuts","default":3,"min":0.5,"max":50,"step":0.5,"unit":"ticks per frame","doc":"A tick change larger than this in one frame is a cut (cross-fade) instead of a glide.","evidence":"Design"},{"id":"motion.safetyNet","group":"motion","type":"boolean","label":"Safety net","default":true,"doc":"Every displayed frame is verified; of two solid tiles that would still overlap the lighter one is dimmed below 0.5 and travels to its certified place (counted). Turn off only to measure how often it fires.","evidence":"Design"},{"id":"motion.reduced","group":"motion","type":"select","label":"Reduced motion","default":"auto","options":[{"value":"auto","label":"Follow the system setting"},{"value":"on","label":"Always reduce"},{"value":"off","label":"Never reduce"}],"doc":"Reduced motion lands seeks at once and shows the layout as solved, with short fades.","evidence":"Design"},{"id":"camera.zoom","group":"camera","type":"number","label":"Zoom","default":14,"min":11,"max":18,"step":0.05,"unit":"zoom","doc":"Map zoom (Mapbox 512 px world). The site opens at 13.5; desktop views are clamped to 12.04 or more.","evidence":"Documented","source":"docs/pitch/anim/01-current-tiles-jitter.md"},{"id":"camera.zoomGlideMs","group":"camera","type":"number","label":"Zoom glide","default":180,"min":0,"max":800,"step":10,"unit":"ms","doc":"Wheel zoom glides with this time constant.","evidence":"Design"},{"id":"camera.panGlideMs","group":"camera","type":"number","label":"Pan glide","default":120,"min":0,"max":800,"step":10,"unit":"ms","doc":"Camera moves (scene jumps) glide with this time constant.","evidence":"Design"},{"id":"camera.minZoom","group":"camera","type":"number","label":"Lowest zoom","default":11,"min":8,"max":14,"step":0.5,"unit":"zoom","doc":"Lowest zoom the Studio allows.","evidence":"Design"},{"id":"camera.maxZoom","group":"camera","type":"number","label":"Highest zoom","default":18,"min":14,"max":20,"step":0.5,"unit":"zoom","doc":"Highest zoom the Studio allows (the site's maximum is 18).","evidence":"Documented","source":"docs/pitch/anim/01-current-tiles-jitter.md"},{"id":"scene.leaders","group":"scene","type":"boolean","label":"Leader lines","default":true,"doc":"Draw a thin line from a displaced tile to its pin on the true position.","evidence":"Design"},{"id":"scene.pins","group":"scene","type":"boolean","label":"True-position pins","default":true,"doc":"Draw a pin on the true position of every displaced tile.","evidence":"Design"},{"id":"scene.hulls","group":"scene","type":"boolean","label":"Aggregate member dots","default":true,"doc":"Draw a dot on the true position of every record an aggregate stands for.","evidence":"Design"},{"id":"scene.hitSlopPx","group":"scene","type":"number","label":"Click tolerance","default":4,"min":0,"max":16,"step":1,"unit":"px","doc":"Extra pixels around a tile that still count as a click on it.","evidence":"Design"},{"id":"skin.id","group":"skin","type":"registry","registry":"skins","label":"Skin","default":"reference","doc":"The skin that draws the tiles. The Studio ships one built-in REFERENCE skin that exercises every channel; design pitches register their own.","evidence":"Design"},{"id":"skin.ageChannel","group":"skin","type":"boolean","label":"Last-fix age channel","default":true,"doc":"Reference skin: dim and dash the outline of a tile whose latest keyframe is old, so a carried-forward tile does not look like a fresh report (03-data-fuel.md).","evidence":"Design"},{"id":"backdrop.id","group":"backdrop","type":"registry","registry":"backdrops","label":"Backdrop","default":"
