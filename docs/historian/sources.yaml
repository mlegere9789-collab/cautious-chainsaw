tiers:
  A: Public domain (US Government work, or published before 1931 on the curated identifier allow-list). May be ingested, indexed, redistributed in derived shards, quoted; may be sent to a model (build time only).
  B: Reusable with attribution and/or share-alike (CC BY, CC BY-SA, ODbL, MIT). Separate files, per-record licence and attribution, never in a vector index or a model call.
  C: Link-out only. Never fetched, stored, embedded or sent to a model. Deep links are fine.
  A-pending: Believed public but awaiting a written confirmation or a source-level check. Not shipped until confirmed.
