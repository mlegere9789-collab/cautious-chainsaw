<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>social card source (WP-T0-14)</title>
<!--
  Source of the Tranche-0 interim images (D-MEDIA default: own vector/typographic art, NO third-party basemap imagery, no screenshot):
    #og    1200x630  og:image / twitter:image  -> /og/card-r1.png
    #day1  1280x720  manifest screenshot       -> /screenshots/day1.png
    #day3  1280x720  manifest screenshot       -> /screenshots/day3.png
  Name-neutral: no product name, no counts, no clock claims (those change in S2 / D-TIME).  The artwork is abstract: contour
  rings from a seeded generator and dots on stylised lines; it depicts no real position.  Rendered by render.mjs (headless Chrome,
  viewport = image size); build_assets.py converts to 8-bit RGB.  Everything is deterministic (seeded PRNG, no Date, no network).
-->
<style>
  html, body { margin: 0; padding: 0; background: #0a0a14; }
  svg { display: block; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .sans { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  const variant = (location.hash || '#og').slice(1);
  const CFG = {
    og:   { W: 1200, H: 630, eyebrow: 'JULY 1–3, 1863', title: ['The Battle', 'of Gettysburg'], sub: ['An interactive, animated map of', 'the three-day battle'], day: 0 },
    day1: { W: 1280, H: 720, eyebrow: 'DAY 1  ·  JULY 1, 1863', title: ['First contact on', 'McPherson’s Ridge'], sub: ['The opening day of the battle'], day: 1 },
    day3: { W: 1280, H: 720, eyebrow: 'DAY 3  ·  JULY 3, 1863', title: ['Pickett’s Charge', 'across the open fields'], sub: ['The final day of the battle'], day: 3 },
  }[variant];
  if (!CFG) throw new Error('unknown variant ' + variant);
  const { W, H } = CFG;
  const C = { bg: '#0a0a14', panel: '#12121e', ink: '#e8e6df', gold: '#c9a24b', muted: '#8a93a8', line: '#1e1e2e', union: '#4477cc', conf: '#cc5544' };

  // seeded PRNG (mulberry32) so the picture is reproducible
  let seed = { og: 1863, day1: 701, day3: 703 }[variant];
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const f = (n) => n.toFixed(1);

  const closedPath = (pts) => {
    const n = pts.length; let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
    }
    return d + 'Z';
  };
  // a hill = nested, slightly irregular rings (contour lines)
  const hill = (cx, cy, rx, ry, rot, rings, opacity) => {
    const a = rnd() * 6.28, b = rnd() * 6.28, c = rnd() * 6.28, cs = Math.cos(rot), sn = Math.sin(rot);
    let out = '';
    for (let k = 1; k <= rings; k++) {
      const s = k / rings, pts = [];
      for (let i = 0; i < 28; i++) {
        const th = (i / 28) * Math.PI * 2;
        const r = 1 + 0.10 * Math.sin(2 * th + a + k * 0.21) + 0.07 * Math.sin(3 * th + b - k * 0.17) + 0.04 * Math.sin(5 * th + c + k * 0.33);
        const x = rx * s * r * Math.cos(th), y = ry * s * r * Math.sin(th);
        pts.push([cx + x * cs - y * sn, cy + x * sn + y * cs]);
      }
      out += `<path d="${closedPath(pts)}" fill="none" stroke="#5f6f96" stroke-opacity="${(opacity * (0.35 + 0.65 * s)).toFixed(2)}" stroke-width="1.4"/>`;
    }
    return out;
  };
  const dots = (pts, fill, r) => pts.map((p) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="${fill}" stroke="${C.bg}" stroke-width="1.5"/>`).join('');
  const smoothLine = (poly) => { // open Catmull-Rom through poly
    let d = `M${f(poly[0][0])},${f(poly[0][1])}`;
    for (let i = 0; i < poly.length - 1; i++) {
      const p0 = poly[Math.max(0, i - 1)], p1 = poly[i], p2 = poly[i + 1], p3 = poly[Math.min(poly.length - 1, i + 2)];
      d += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
    }
    return d;
  };
  const sample = (poly, n) => { // n points evenly along the control polyline
    const seg = []; let total = 0;
    for (let i = 0; i < poly.length - 1; i++) { const l = Math.hypot(poly[i + 1][0] - poly[i][0], poly[i + 1][1] - poly[i][1]); seg.push(l); total += l; }
    const out = [];
    for (let k = 0; k < n; k++) {
      let d = (k / (n - 1)) * total, i = 0; while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const t = seg[i] ? d / seg[i] : 0; out.push([poly[i][0] + (poly[i + 1][0] - poly[i][0]) * t, poly[i][1] + (poly[i + 1][1] - poly[i][1]) * t]);
    }
    return out;
  };
  const arrow = (x0, y, x1) => `<path d="M${x0},${y} L${x1},${y}" stroke="${C.gold}" stroke-opacity="0.75" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${x1 - 10},${y - 10} L${x1 + 10},${y} L${x1 - 10},${y + 10}" stroke="${C.gold}" stroke-opacity="0.75" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  const guide = (poly, color) => `<path d="${smoothLine(poly)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="2"/>`;

  // ---------------------------------------------------------------- artwork per variant (right-hand panel)
  const wide = W === 1280;
  const px = wide ? 640 : 590;                        // left edge of the artwork area (mask fade start)
  const shift = wide ? 110 : 0;                       // the 1280x720 artwork sits further right (longer titles)
  let hills = '', art = '';
  if (variant === 'og') {
    hills += hill(930, 300, 240, 200, -0.5, 7, 0.55) + hill(790, 480, 150, 80, 0.3, 5, 0.45) + hill(1060, 110, 110, 60, 0.6, 4, 0.4);
    const union = [[965, 105], [1035, 150], [1065, 215], [1035, 275], [965, 315], [950, 385], [965, 455], [1000, 520]];
    const conf = [[770, 130], [735, 230], [738, 330], [782, 430], [860, 505], [950, 560]];
    art += guide(union, C.union) + guide(conf, C.conf) + dots(sample(union, 22), C.union, 7) + dots(sample(conf, 25), C.conf, 7);
  } else if (variant === 'day1') {
    hills += hill(1000, 250, 230, 170, -0.15, 7, 0.55) + hill(860, 540, 180, 80, 0.1, 5, 0.45) + hill(1140, 570, 110, 60, 0.4, 3, 0.35);
    const union = [[935, 170], [930, 260], [945, 350], [965, 440]];
    art += guide(union, C.union) + dots(sample(union, 10), C.union, 8);
    for (const row of [[[690, 200], [800, 196]], [[672, 320], [800, 316]], [[690, 440], [810, 436]]]) art += dots(sample(row, 6), C.conf, 8);
    art += arrow(830, 258, 890) + arrow(830, 378, 890);
  } else {
    hills += hill(1060, 330, 200, 240, 0.1, 7, 0.55) + hill(800, 250, 150, 110, -0.2, 4, 0.4) + hill(830, 570, 190, 70, 0.05, 4, 0.35);
    const union = [[1040, 150], [1032, 250], [1042, 350], [1030, 450], [1040, 545]];
    const conf = [[705, 150], [700, 260], [712, 370], [700, 480], [708, 545]];
    art += guide(union, C.union) + dots(sample(union, 17), C.union, 8) + guide(conf, C.conf) + dots(sample(conf, 17), C.conf, 8);
    for (const y of [235, 350, 465]) art += arrow(750, y, 960);
  }

  // ---------------------------------------------------------------- text block
  const tx = 72;
  const titleSize = wide ? 60 : 80, subSize = wide ? 28 : 30;
  const eyebrowY = wide ? 168 : 150;
  const titleY = eyebrowY + titleSize + 20;
  let text = `<text class="sans" x="${tx}" y="${eyebrowY}" fill="${C.gold}" font-size="22" font-weight="700" letter-spacing="5" xml:space="preserve">${CFG.eyebrow}</text>`;
  CFG.title.forEach((line, i) => { text += `<text class="serif" x="${tx - 3}" y="${titleY + i * (titleSize + 8)}" fill="${C.ink}" font-size="${titleSize}" font-weight="700">${line}</text>`; });
  const ruleY = titleY + (CFG.title.length - 1) * (titleSize + 8) + 44;
  text += `<rect x="${tx}" y="${ruleY}" width="84" height="4" rx="2" fill="${C.gold}"/>`;
  CFG.sub.forEach((line, i) => { text += `<text class="sans" x="${tx}" y="${ruleY + 52 + i * 40}" fill="${C.muted}" font-size="${subSize}">${line}</text>`; });

  // ---------------------------------------------------------------- three-day timeline (bottom left)
  const tlY = H - 84;
  let tl = '';
  for (let d = 1; d <= 3; d++) {
    const x = tx + (d - 1) * 150, active = CFG.day === 0 || CFG.day === d;
    tl += `<rect x="${x}" y="${tlY}" width="132" height="8" rx="4" fill="${active ? C.gold : 'none'}" stroke="${C.gold}" stroke-opacity="${active ? 1 : 0.6}" stroke-width="1.5"/>`;
    tl += `<text class="sans" x="${x}" y="${tlY + 34}" fill="${active ? C.ink : C.muted}" font-size="16" font-weight="600" letter-spacing="3">DAY ${d}</text>`;
  }

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs>
      <linearGradient id="fadeL" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
      <mask id="artMask"><rect x="${px - 130}" y="0" width="${W - px + 130}" height="${H}" fill="url(#fadeL)"/></mask>
      <clipPath id="frame"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath>
    </defs>
    <rect width="${W}" height="${H}" fill="${C.bg}"/>
    <g mask="url(#artMask)" clip-path="url(#frame)"><g transform="translate(${shift},0)">${hills}</g></g>
    <g clip-path="url(#frame)"><g transform="translate(${shift},0)">${art}</g></g>
    <rect x="0" y="0" width="${W}" height="6" fill="${C.gold}"/>
    ${text}
    ${tl}
  </svg>`;
  document.getElementById('stage').innerHTML = svg;
  document.title = variant;
  window.__ready = true;
})();
</script>
</body>
</html>
