<!doctype html><meta charset="utf-8"><title>photomatch render</title>
<body style="margin:0"><canvas id="c"></canvas>
<script type="module">
// Deterministic headless render of the Battle Theatre ground (bare-earth DEM + 1863 base-map structure layers) from a registered camera pose.
// No 1863 land cover, no trees: the DEM is MODERN ground (terrain.json sources). Structures are the repository's reconstruction layers.
const Z15 = 2 ** 15 * 512;
const wpx = (lng, lat) => { const s = Math.sin(lat * Math.PI / 180); return [(lng + 180) / 360 * Z15, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * Z15]; };
let T, S, gl, progs = {};
async function load() {
  const meta = await (await fetch('/prototype/data/terrain.json')).json();
  const u16 = new Uint16Array(await (await fetch('/prototype/data/height.bin')).arrayBuffer());
  const N = meta.N, sc = (meta.hmax - meta.hmin) / 65535, h = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) h[i] = meta.hmin + u16[i] * sc;   // absolute metres
  const [bx, by, bw, bh] = meta.z15box, mpp = meta.groundMPerZ15Px;
  T = { N, W: meta.widthM, H: meta.heightM, h, xz: (lng, lat) => { const [px, py] = wpx(lng, lat); return [(px - bx - bw / 2) * mpp, (py - by - bh / 2) * mpp]; } };
  T.at = (x, z) => { const u = (x / T.W + .5) * (N - 1), v = (z / T.H + .5) * (N - 1); const i = Math.max(0, Math.min(N - 2, Math.floor(u))), j = Math.max(0, Math.min(N - 2, Math.floor(v))), fu = Math.min(1, Math.max(0, u - i)), fv = Math.min(1, Math.max(0, v - j));
    return h[j * N + i] * (1 - fu) * (1 - fv) + h[j * N + i + 1] * fu * (1 - fv) + h[(j + 1) * N + i] * (1 - fu) * fv + h[(j + 1) * N + i + 1] * fu * fv; };
  S = await (await fetch('/app/data/structures3d.json')).json();
}
function prog(vs, fs) { const p = gl.createProgram(); for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); } gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
const mul = (a, b) => { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; };
function viewProj(p) {   // p: {x,y,z (m), yawDeg: bearing from north, pitchDeg, fovDegH, aspect}
  const yaw = p.yawDeg * Math.PI / 180, pit = p.pitchDeg * Math.PI / 180;
  const f = [Math.sin(yaw) * Math.cos(pit), Math.sin(pit), -Math.cos(yaw) * Math.cos(pit)];   // x east, y up, z SOUTH (so north = -z)
  const up0 = [0, 1, 0]; const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], nm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const r = nm(cr(f, up0)), u = cr(r, f), e = [p.x, p.y, p.z], d = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const V = new Float32Array([r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -d(r, e), -d(u, e), d(f, e), 1]);
  const fh = p.fovDegH * Math.PI / 180, t = 1 / Math.tan(fh / 2), n = 1, fa = 12000;
  const P = new Float32Array([t, 0, 0, 0, 0, t * p.aspect, 0, 0, 0, 0, -(fa + n) / (fa - n), -1, 0, 0, -2 * fa * n / (fa - n), 0]);
  return mul(P, V);
}
function buf(arr) { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW); return b; }
function terrainMesh() {
  const step = 2, n = Math.floor((T.N - 1) / step) + 1, pos = new Float32Array(n * n * 3);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const k = (j * n + i) * 3, x = (i * step / (T.N - 1) - .5) * T.W, z = (j * step / (T.N - 1) - .5) * T.H; pos[k] = x; pos[k + 1] = T.h[j * step * T.N + i * step]; pos[k + 2] = z; }
  const idx = new Uint32Array((n - 1) * (n - 1) * 6); let q = 0; for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) { const a = j * n + i, b = a + 1, c = a + n, d = c + 1; idx.set([a, c, b, b, c, d], q); q += 6; }
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW); return { vb: buf(pos), ib, count: idx.length };
}
const toM = (lng, lat) => T.xz(lng, lat);
function lineSets(opts) {   // {fences:[xyz...], bld:[...], roads:[...]} as GL_LINES vertex arrays, draped on the DEM (+lift)
  const out = { fence: [], bld: [], road: [] };
  const seg = (arr, c, lift) => { for (let i = 0; i + 1 < c.length; i++) { const [x0, z0] = toM(...c[i]), [x1, z1] = toM(...c[i + 1]); const L = Math.hypot(x1 - x0, z1 - z0), m = Math.max(1, Math.ceil(L / 8)); for (let s = 0; s < m; s++) { const a = s / m, b = (s + 1) / m, xa = x0 + (x1 - x0) * a, za = z0 + (z1 - z0) * a, xb = x0 + (x1 - x0) * b, zb = z0 + (z1 - z0) * b; arr.push(xa, T.at(xa, za) + lift, za, xb, T.at(xb, zb) + lift, zb); } } };
  for (const f of S.fences) { seg(out.fence, f.coords, 1.4); seg(out.fence, f.coords, 0.1); }
  for (const b of S.buildings) if (b.ring) { const lift = (b.storeys && b.storeys.n ? b.storeys.n : 1) * 3.2; seg(out.bld, b.ring, 0.1); seg(out.bld, b.ring, lift); for (let i = 0; i + 1 < b.ring.length; i++) { const [x, z] = toM(...b.ring[i]), y = T.at(x, z); out.bld.push(x, y, z, x, y + lift, z); } }
  for (const r of S.roads) for (const l of (r.lines || [])) seg(out.road, l, 0.15);
  return out;
}
window.btRender = async (pose, W = 960, H = 640) => {
  if (!T) await load();
  const c = document.getElementById('c'); c.width = W; c.height = H;
  if (!gl) {
    gl = c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    progs.t = prog(`#version 300 es
in vec3 p; uniform mat4 M; out vec3 w; void main(){ w=p; gl_Position=M*vec4(p,1.); }`, `#version 300 es
precision highp float; in vec3 w; uniform vec3 eye; out vec4 o;
void main(){ vec3 n=normalize(cross(dFdx(w),dFdy(w))); n=n.y<0.?-n:n; vec3 L=normalize(vec3(-.45,.75,.35)); float d=clamp(dot(n,L),0.,1.); float fog=1.-exp(-length(w-eye)/9000.); vec3 col=mix(vec3(.18+.55*d),vec3(.78,.82,.88),fog); o=vec4(col,1.); }`);
    progs.l = prog(`#version 300 es
in vec3 p; uniform mat4 M; void main(){ gl_Position=M*vec4(p,1.); gl_Position.z-=0.0004*gl_Position.w; }`, `#version 300 es
precision highp float; uniform vec3 col; out vec4 o; void main(){ o=vec4(col,1.); }`);
    gl.getExtension('OES_element_index_uint');
    window._mesh = terrainMesh(); window._lines = lineSets();
    for (const k in window._lines) window._lines[k] = { vb: buf(new Float32Array(window._lines[k])), n: window._lines[k].length / 3 };
  }
  gl.viewport(0, 0, W, H); gl.enable(gl.DEPTH_TEST); gl.clearColor(.78, .82, .88, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const [ex, ez] = toM(pose.lng, pose.lat), ground = T.at(ex, ez), eye = { x: ex, y: (pose.elevM != null ? pose.elevM : ground + pose.agl), z: ez };
  const M = viewProj({ ...eye, yawDeg: pose.headingDeg, pitchDeg: pose.pitchDeg, fovDegH: pose.fovHDeg, aspect: W / H });
  gl.useProgram(progs.t); gl.uniformMatrix4fv(gl.getUniformLocation(progs.t, 'M'), false, M); gl.uniform3f(gl.getUniformLocation(progs.t, 'eye'), eye.x, eye.y, eye.z);
  gl.bindBuffer(gl.ARRAY_BUFFER, window._mesh.vb); let a = gl.getAttribLocation(progs.t, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, window._mesh.ib); gl.drawElements(gl.TRIANGLES, window._mesh.count, gl.UNSIGNED_INT, 0);
  const base = c.toDataURL('image/png');
  gl.useProgram(progs.l); gl.uniformMatrix4fv(gl.getUniformLocation(progs.l, 'M'), false, M);
  const colr = { fence: [1, .55, 0], bld: [1, 0, .3], road: [.1, .6, 1] };
  for (const k of ['road', 'fence', 'bld']) { const L = window._lines[k]; gl.bindBuffer(gl.ARRAY_BUFFER, L.vb); a = gl.getAttribLocation(progs.l, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 3, gl.FLOAT, false, 0, 0); gl.uniform3f(gl.getUniformLocation(progs.l, 'col'), ...colr[k]); gl.drawArrays(gl.LINES, 0, L.n); }
  return { base, full: c.toDataURL('image/png'), eye, groundM: ground };
};
window.btReady = true;
</script>
